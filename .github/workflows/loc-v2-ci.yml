name: LOC V2 quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [loc-v2-m2-foundation, loc-v2-screening-flow, loc-v2-health-timeline, loc-v2-m4-crypto-spike, loc-v2-m4-benchmark-review]

permissions:
  contents: read

concurrency:
  group: loc-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Run unit tests
        run: npm test

  clinical-regression:
    name: Existing Python clinical regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run existing tests
        run: python -m pytest -q
